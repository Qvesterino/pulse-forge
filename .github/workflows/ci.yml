name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A stale run for a superseded commit wastes runners — but cancelling the
# RUNNING one costs more than that, because the verdict is the product here.
# Measured 2026-10-28: the unit-tests job needs 22-29 min on a GitHub runner
# (it compiles a 39 MB WebAssembly module and runs 1326 spec files), and the
# team pushes every ~5 min. With cancel-in-progress: true every one of those
# pushes killed the run in flight: 22 runs cancelled that day, and the
# unit-tests job NEVER reached a verdict — so nobody could tell whether it
# was green. My own verification run was cancelled 5.4 min in, by a push that
# had nothing to do with the change under test.
#
# With cancel-in-progress: false the running job finishes and reports, and
# GitHub keeps only the LATEST pending run in the group (an older pending
# run is cancelled and replaced). So at most one superseded run is wasted,
# and every run that starts produces a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    name: Typecheck (clean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 in EVERY job (measured 2026-10-29). The Audiotool NEXUS
          # SDK's node entry uses Promise.withResolvers, which is Node >= 22:
          # on Node 20 every test that calls createOfflineDocument() died with
          # "TypeError: Promise.withResolvers is not a function" - 8 reds in
          # one file, and no other symptom to explain them. GitHub also
          # deprecates Node 20 on its runners. package.json declares the
          # same floor in "engines", so a developer on Node 20 hears about it
          # at install time instead of in a test failure.
          node-version: 24
          cache: npm
      - run: npm ci
      # Always run the clean variant so the local incremental cache (or
      # a stale `.tsbuildinfo` left in the workspace) can never mask a
      # cross-agent typecheck regression.
      - run: npm run typecheck:clean

  hygiene:
    name: Hygiene (format + drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every MAINTAINED source tree must be prettier-clean. The scope lives in
      # package.json ("format:check") and is deliberately not just src+tests:
      # the two-directory scope left scripts/, docs/, prompts/ and the desktop
      # shell unchecked, so 190+ files drifted without anyone noticing.
      #
      # The output also goes into the JOB SUMMARY and an ERROR ANNOTATION — a
      # failed job's log sits behind a login, and both of those can be read
      # without an account.
      - name: Run npm run format:check
        run: |
          set +e
          npm run format:check 2>&1 | tee /tmp/format.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### npm run format:check FAILED (exit $status)"
              echo '```'
              tail -60 /tmp/format.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=npm run format:check failed (exit %s)::%s\n' "$status" \
              "$(tail -60 /tmp/format.log | tr -d '\r' | tr '\n' ' ' | sed -e 's/%/%25/g' | head -c 8000)"
          fi
          exit $status
      # Every DERIVABLE artifact must match its generator: the MCP tool
      # mirrors, the domain goldens, and the counts in docs/CURRENT-STATE.md.
      # Drift here means "the feature landed, the artifact is stale" — the bug
      # class this repo keeps shipping, and the one no unit test can see.
      #
      # Its findings go into the JOB SUMMARY for the same reason as the
      # format check: the drift report names the artifact and the generator
      # that disagree, and it must be readable without an account.
      - name: Run npm run drift:check
        run: |
          set +e
          npm run drift:check 2>&1 | tee /tmp/drift.log
          status=${PIPESTATUS[0]}
          {
            echo "### npm run drift:check (exit $status)"
            echo '```'
            tail -40 /tmp/drift.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Fast, side-effect-free mirror check. `drift:check` also regenerates
      # the mirrors as part of its artifact sweep; this step fails on the
      # first stale mirror instead of waiting for the whole drift run, and it
      # never writes the working tree.
      - name: Verify MCP mirrors
        run: npm run verify:mcp-mirrors

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Soak heap gates call global.gc?.() — without exposed GC the numbers
      # measure garbage, not leaks (47.9 MB vs 0.7 MB for identical code).
      # test:expectations runs the SAME full suite once (JSON report + eval):
      # the failure set must exactly match suite-expectations.json — a new
      # red OR a cured ledger entry fails the build (the baseline may only
      # shrink; see scripts/suite-expectations.mjs).
      # The failing spec names go to the job summary AND to an error
      # annotation. A failed job's log sits behind a login, and "Process
      # completed with exit code 1" alone cannot tell the next agent WHICH
      # spec regressed — the ratchet decides on the failure SET, so the
      # annotation has to carry the set.
      - name: Run npm run test:expectations
        run: |
          set +e
          npm run test:expectations 2>&1 | tee /tmp/vitest.log
          status=${PIPESTATUS[0]}
          # Vitest colours its output, and the ANSI escapes sit BETWEEN the
          # reporter's layout and the words — a grep for "FAIL" never matched
          # and the annotation arrived with an empty failure section. Strip
          # them first, then grep the plain text.
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/vitest.log > /tmp/vitest.plain.log
          if [ "$status" -ne 0 ]; then
            {
              echo "### npm run test:expectations FAILED (exit $status)"
              echo '```'
              grep -E 'suite run:|NEW REDS|CURED \(|LEDGER PROBLEMS|ledger matches reality' /tmp/vitest.plain.log | head -20 || true
              echo '--- failure text ---'
              grep -aE 'AssertionError|^ *(Error|TypeError|ReferenceError):|FAIL ' /tmp/vitest.plain.log | head -24 || true
              echo '--- ledger entries (the failure set) ---'
              grep -E '^ +- ' /tmp/vitest.plain.log | head -60 || true
              echo '--- tail ---'
              tail -30 /tmp/vitest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=unit tests failed (exit %s)::%s\n' "$status" \
              "$( { grep -E 'suite run:|NEW REDS|CURED \(|LEDGER PROBLEMS|ledger matches reality' /tmp/vitest.plain.log | head -20; \
                   echo '--- failure text ---'; \
                   grep -aE 'AssertionError|^ *(Error|TypeError|ReferenceError):|FAIL ' /tmp/vitest.plain.log | head -24; \
                   echo '--- ledger entries (the failure set) ---'; \
                   grep -E '^ +- ' /tmp/vitest.plain.log | head -60; } \
                 | tr -d '\r' | tr '\n' ' ' | sed -e 's/%/%25/g' | head -c 4096)"
          fi
          exit $status
        env:
          NODE_OPTIONS: --expose-gc
      - run: npm run ai:performance

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc --noEmit + vite build — catches bundler-level regressions that
      # unit tests never see (dynamic imports, PWA precache, chunking).
      #
      # A failed job's LOG sits behind a login, so for 134 consecutive runs
      # every job died at `npm ci` and nobody could read why. The failure text
      # therefore goes to two places: the job summary (for a human on the run
      # page) and an ERROR ANNOTATION (for anything that can read the
      # check-run's annotations API without an account). The exit code is
      # passed through unchanged.
      - name: Run npm run build
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### npm run build FAILED (exit $status)"
              echo '```'
              tail -120 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=npm run build failed (exit %s)::%s\n' "$status" \
              "$(tail -120 /tmp/build.log | tr -d '\r' | tr '\n' ' ' | sed -e 's/%/%25/g' | head -c 8000)"
          fi
          exit $status
      # Hand the EXACT dist this job produced to the UI-gate job. The gates
      # measure a frozen build, not a dev server, and one build has to be the
      # single source of what was measured — two builds would be two subjects.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error
      # Validate the exact production-only invariants without contacting a
      # deployment. The real origin/token are supplied by the deployment
      # environment, while CI uses explicit non-secret sentinels.
      - run: npm run release:preflight
        env:
          NODE_ENV: production
          CORS_ORIGIN: https://ci.invalid
          KYX_GALLERY_PUBLIC: "1"
          GALLERY_ADMIN_TOKEN: ci-only-preflight-token
      - run: npm run release:server-smoke

  ui-gate:
    name: UI gates (proportion, typography, material, state matrix, camera)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The gates drive a real Chromium: they click the real transport, move a
      # real pointer, and measure the rendered pixels.
      - run: npx playwright install --with-deps chromium
      # The five UI gates in one command — the shell's proportions (5 viewports
      # x 3 media branches), the declared type roles, the declared material,
      # every interaction state, and what the sequencer costs while it plays.
      #
      # Exit 0 = every gate ran and held. 1 = a gate ran and FAILED. 2 = the
      # harness broke and NOTHING was measured — deliberately distinct, so a
      # broken harness is never read as a broken shell.
      #
      # Before this job these gates only ran when a person remembered to run
      # them, which made them a tool for one human, not a gate for the product
      # (STUDIO-OPTIMIZATION-PLAN.md §3.5).
      #
      # The failure text goes to the job summary AND to an error annotation:
      # a failed job's log sits behind a login, and a gate whose verdict
      # cannot be read is a gate nobody can act on.
      - name: Run npm run gate
        run: |
          set +e
          npm run gate 2>&1 | tee /tmp/gate.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### npm run gate FAILED (exit $status)"
              echo '```'
              echo '--- failing gates ---'
              grep -E 'FAIL' /tmp/gate.log | head -20 || true
              echo '--- tail ---'
              tail -30 /tmp/gate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=UI gates failed (exit %s)::%s\n' "$status" \
              "$( { grep -E 'FAIL' /tmp/gate.log | head -12; echo '--- tail ---'; tail -20 /tmp/gate.log; } \
                 | tr -d '\r' | tr '\n' ' ' | sed -e 's/%/%25/g' | head -c 8000)"
          fi
          exit $status

  test-browser:
    name: Browser audio checks (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # verify-browser.mjs spins up Vite + Playwright Chromium. Playwright
      # auto-installs the browser on first run.
      - run: npx playwright install --with-deps chromium
      # The failure text goes to the job summary AND to an error annotation —
      # this gate is the one that says WHICH console error or missing asset
      # broke the boot, and a failed job's log sits behind a login.
      - name: Run npm run test:browser
        run: |
          set +e
          npm run test:browser 2>&1 | tee /tmp/browser.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### npm run test:browser FAILED (exit $status)"
              echo '```'
              echo '--- failing checks ---'
              grep -E 'FAIL' /tmp/browser.log | head -20 || true
              echo '--- tail ---'
              tail -30 /tmp/browser.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # GitHub caps an error annotation at 4096 BYTES (measured: a
            # 4032-character message with 3-byte characters arrived as
            # exactly 4096 bytes, and raising the budget changed nothing).
            # So the message has to carry the identifying information FIRST:
            # the failing-case labels, then the diagnostics. A tail-first
            # message loses the cases at its end.
            printf '::error title=browser audio checks failed (exit %s)::%s\n' "$status" \
              "$( { grep -E 'FAIL' /tmp/browser.log | head -12; echo '--- tail ---'; tail -20 /tmp/browser.log; } \
                 | tr -d '\r' | tr '\n' ' ' | sed -e 's/%/%25/g' | head -c 4096)"
          fi
          exit $status
      # Real-browser AI-control gate: the persisted-save receipt through
      # IndexedDB (kyx_save). The measured DSP read-back gate is run locally
      # (`npm run verify:param-readback`, Node 24 type-stripped .mts).
      - run: npm run verify:mcp-save
      - run: npm run verify:audible

  test-browser-production:
    name: Production browser smoke (dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # This job intentionally builds its own dist: the dev-server browser job
      # above cannot catch production-only asset paths or chunk loading errors.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The failure text goes to the job summary AND to an error annotation —
      # a failed job's log sits behind a login, and this gate is the one that
      # reports WHICH console error or missing asset broke the boot.
      - name: Run npm run test:browser:production
        run: |
          set +e
          npm run test:browser:production 2>&1 | tee /tmp/prodsmoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### npm run test:browser:production FAILED (exit $status)"
              echo '```'
              tail -60 /tmp/prodsmoke.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=production browser smoke failed (exit %s)::%s\n' "$status" \
              "$(tail -60 /tmp/prodsmoke.log | tr -d '\r' | tr '\n' ' ' | sed -e 's/%/%25/g' | head -c 8000)"
          fi
          exit $status

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The isolated scenario specs (landing → studio, panel toggles, generate
      # flow, persistence roundtrip) catch user-flow regressions the page-level
      # browser checks above do not model. The vitest webServer config owns
      # server startup (predev builds the worklet bundles first).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke

  audit-prod:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Prod-only gate (release roadmap Fáza 3): runtime dependencies must
      # stay vulnerability-free. Dev-dependency advisories (e.g. the esbuild
      # dev-server one nested under vitest 2) are consciously deferred — see
      # RELEASE_ROADMAP.md 2.5.
      - run: npm audit --omit=dev --audit-level=high

  desktop-macos-mrt2:
    name: macOS arm64 Electron package (MRT2)
    runs-on: macos-15
    needs:
      - typecheck
      - test
      - build
      - ui-gate
      - test-browser
      - test-browser-production
      - e2e-smoke
      - audit-prod
    permissions:
      contents: read
    steps:
      - name: Checkout KYX
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned Magenta RealTime source
        uses: actions/checkout@v4
        with:
          repository: magenta/magenta-realtime
          ref: v2.0.3
          path: upstream-magenta-realtime
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Apple Silicon runner and CMake
        run: |
          test "$(uname -m)" = "arm64"
          xcode-select -p
          if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
          cmake --version
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const version = execFileSync("cmake", ["--version"], { encoding: "utf8" }).match(/cmake version (\d+)\.(\d+)/);
            if (!version || Number(version[1]) < 3 || (Number(version[1]) === 3 && Number(version[2]) < 27)) {
              throw new Error("CMake 3.27 or newer is required by the MRT2 native host.");
            }
          '
      - run: npm ci
      - name: Run MRT2 provider and Electron bridge tests on macOS
        run: >-
          npx vitest run tests/generative-mrt2-protocol.test.ts
          tests/generative-mrt2-electron-transport.test.ts
          tests/mrt2-native-host-manager.test.ts
          tests/mrt2-electron-bridge.test.ts
      - name: Build KYX MRT2 macOS DMG and ZIP
        run: npm run desktop:build:mac:mrt2
        env:
          MAGENTA_REALTIME_SOURCE: ${{ github.workspace }}/upstream-magenta-realtime
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify artifacts and boot packaged Electron app
        run: node scripts/verify-mrt2-mac-package.mjs
      - name: Offer tested macOS artifacts for download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KYX-macOS-arm64-MRT2-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  mrt2-windows-boundary:
    name: Windows MRT2 companion boundary
    runs-on: windows-latest
    needs:
      - typecheck
      - test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Windows manager, bridge and provider contract
        shell: pwsh
        run: >-
          npx vitest run
          tests/generative-mrt2-protocol.test.ts
          tests/generative-mrt2-electron-transport.test.ts
          tests/generative-mrt2-windows-transport.test.ts
          tests/mrt2-windows-host-manager.test.ts
          tests/mrt2-windows-assets.test.ts
          tests/mrt2-electron-bridge.test.ts
      - name: Validate desktop and benchmark entrypoints
        shell: pwsh
        run: >-
          node --check desktop/mrt2-windows-host-manager.cjs;
          node --check desktop/mrt2-wsl2-host-manager.cjs;
          node --check desktop/main.cjs;
          node --check desktop/mrt2-windows-assets.cjs;
          node --check desktop/mrt2-bridge.cjs;
          node --check scripts/benchmark-mrt2-windows.mjs;
          node --check scripts/desktop-package-mrt2-windows.mjs;
          node --check scripts/create-mrt2-windows-manifest.mjs;
          node --check scripts/verify-mrt2-windows-package.mjs
      - name: Validate Python companion source without installing model runtime
        shell: pwsh
        run: |
          python -m py_compile companion/mrt2-windows/kyx_mrt2_windows_host.py
          python -m unittest discover -s companion/mrt2-windows -p "test_*.py"
